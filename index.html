<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>周末快乐清单</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="app">
        <h1>周末快乐清单</h1>
        <p class="subtitle">这周想做点什么?先记下来,做完就打勾。</p>

        <form id="todo-form">
        <input id="todo-input" type="text" placeholder="例如：去江边骑车" autocomplete="off" />
        <button type="submit">加一条</button>
    </form>

    <p id="task-count">还有0件事等着你</p>
    <ul id="todo-list"></ul>
    </main>
    <script src="app.js"></script>
</body>
</html>
